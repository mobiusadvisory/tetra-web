# Publishes website/ to the Cloudflare Pages project "tetraenergies-web"
# (www.tetraenergies.com) whenever a change to website/ reaches main.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4dc590b7b5a72161b18899cae85de172
          command: pages deploy website --project-name=tetraenergies-web --branch=main --commit-dirty=true
