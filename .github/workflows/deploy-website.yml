# Publishes website/ to the Cloudflare Pages project "tetraenergies-web".
# main    -> production (www.tetraenergies.com)
# preview -> preview copy at https://preview.tetraenergies-web.pages.dev (for review before going live)
name: Deploy website

on:
  push:
    branches: [main, preview]
    paths: ["website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4dc590b7b5a72161b18899cae85de172
          command: pages deploy website --project-name=tetraenergies-web --branch=${{ github.ref_name }} --commit-dirty=true
